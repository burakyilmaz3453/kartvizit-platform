<!DOCTYPE html>
<html lang="tr">
<head>
  <link rel="icon" type="image/x-icon" href="favicon-platform.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifre Sıfırlama | Noshutdown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --gold:#C9A84C; --gold-light:#E2C47A; --gold-dim:#7A6235;
      --bg:#080808; --surface:#111111; --surface2:#161616;
      --border:rgba(201,168,76,0.14); --border-subtle:rgba(255,255,255,0.06);
      --text:#F0EBE1; --text-secondary:#7A7570; --text-muted:#4A4845;
    }
    body {
      background:var(--bg); color:var(--text);
      font-family:'DM Sans',sans-serif; font-weight:300;
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:24px; overflow-x:hidden;
    }
    body::before {
      content:''; position:fixed; inset:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events:none; z-index:0; opacity:0.35;
    }
    .wrap {
      width:100%; max-width:380px; position:relative; z-index:1;
      animation:fadeUp 0.7s ease forwards;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    .brand { text-align:center; margin-bottom:36px; }
    .brand-name {
      font-family:'Cormorant Garamond',serif;
      font-size:1.6rem; letter-spacing:0.18em;
      text-transform:uppercase; color:var(--gold);
    }
    .brand-tagline {
      font-size:0.65rem; letter-spacing:0.14em;
      text-transform:uppercase; color:var(--text-muted); margin-top:6px;
    }
    .card {
      background:var(--surface);
      border:1px solid var(--border-subtle);
      border-radius:12px; padding:36px 32px;
    }
    h2 {
      font-family:'Cormorant Garamond',serif;
      font-size:1.5rem; font-weight:300; color:var(--text); margin-bottom:4px;
    }
    .subtitle { font-size:0.78rem; color:var(--text-muted); margin-bottom:28px; line-height:1.5; }
    .form-group { margin-bottom:14px; }
    label {
      display:block; font-size:0.65rem; letter-spacing:0.1em;
      text-transform:uppercase; color:var(--text-muted); margin-bottom:6px;
    }
    input {
      width:100%; background:var(--surface2);
      border:1px solid var(--border-subtle); border-radius:6px;
      padding:11px 14px; color:var(--text);
      font-size:0.85rem; font-weight:300;
      font-family:'DM Sans',sans-serif; outline:none; transition:0.2s;
    }
    input:focus { border-color:var(--gold-dim); }
    input::placeholder { color:var(--text-muted); }
    .btn {
      width:100%; padding:13px; background:var(--gold); color:#080808;
      border:none; border-radius:6px; font-family:'DM Sans',sans-serif;
      font-size:0.78rem; font-weight:500; letter-spacing:0.12em;
      text-transform:uppercase; cursor:pointer; transition:0.2s; margin-top:6px;
    }
    .btn:hover { background:var(--gold-light); }
    .btn:disabled { background:var(--surface2); color:var(--text-muted); cursor:not-allowed; }
    .error {
      background:rgba(139,42,42,0.12); border:1px solid rgba(139,42,42,0.3);
      color:#FF8080; padding:10px 14px; border-radius:6px;
      font-size:0.78rem; margin-bottom:14px; display:none; line-height:1.4;
    }
    .success {
      background:rgba(201,168,76,0.06); border:1px solid var(--border);
      color:var(--gold); padding:10px 14px; border-radius:6px;
      font-size:0.78rem; margin-bottom:14px; display:none; line-height:1.4;
    }
  </style>
  <link rel="stylesheet" href="assets/css/polish.css"><link rel="stylesheet" href="/assets/css/redesign.css"><link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body class="auth-page" data-auth-page="reset">
  <div class="wrap">
    <div class="brand">
      <div class="brand-name">Noshutdown</div>
      <div class="brand-tagline">Hesap Güvenliği</div>
    </div>
    <div class="card auth-card">
      <h2>Şifre Sıfırlama</h2>
      <p class="subtitle">Hesabın için yeni bir şifre belirle.</p>
      <div class="error auth-alert" id="error-msg" role="alert" aria-live="assertive"></div>
      <div class="success auth-alert" id="success-msg" role="status" aria-live="polite"></div>
      <form id="reset-form" novalidate>
      <div class="form-group">
        <label for="new-password">Yeni Şifre</label>
        <div class="password-field">
          <input type="password" id="new-password" placeholder="En az 8 karakter" autocomplete="new-password" minlength="8" required>
          <button class="password-toggle" type="button" data-target="new-password" aria-label="Şifreyi göster">Göster</button>
        </div>
      </div>
      <div class="form-group">
        <label for="confirm-password">Şifre Tekrar</label>
        <div class="password-field">
          <input type="password" id="confirm-password" placeholder="Şifreyi tekrar gir" autocomplete="new-password" minlength="8" required>
          <button class="password-toggle" type="button" data-target="confirm-password" aria-label="Şifreyi göster">Göster</button>
        </div>
      </div>
      <ul id="password-requirements" class="password-requirements" aria-live="polite">
        <li data-requirement="length">En az 8 karakter</li>
        <li data-requirement="match">Şifreler eşleşiyor</li>
      </ul>
      <button class="btn" id="reset-btn" type="submit" disabled>Şifreyi Güncelle</button>
      </form>
      <p class="auth-note">Bu sayfa yalnızca e-postana gönderilen şifre sıfırlama bağlantısıyla kullanılabilir.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
